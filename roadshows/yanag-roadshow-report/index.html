<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YANAG.com 网站搭建路演报告</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f0dc;
      --muted: rgba(248, 240, 220, 0.72);
      --gold: #e9c46a;
      --green: #7fb069;
      --deep: #06140f;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-snap-type: y mandatory;
      background: var(--deep);
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #06140f;
    }

    .slide {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 680px;
      scroll-snap-align: start;
      overflow: hidden;
      background-image:
        linear-gradient(90deg, rgba(6, 20, 15, 0.86), rgba(6, 20, 15, 0.54) 52%, rgba(6, 20, 15, 0.84)),
        url("./assets/background.svg");
      background-size: cover;
      background-position: center;
      isolation: isolate;
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 16% 22%, rgba(127, 176, 105, 0.26), transparent 26%),
        radial-gradient(circle at 78% 12%, rgba(233, 196, 106, 0.22), transparent 28%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0));
      z-index: -1;
    }

    .slide::after {
      content: "";
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(248, 240, 220, 0.14);
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .progress {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;
      width: 100%;
      height: 4px;
      background: rgba(248, 240, 220, 0.12);
    }

    .progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--gold));
      transition: width 180ms ease;
    }

    .rail {
      position: fixed;
      right: 22px;
      top: 50%;
      z-index: 20;
      transform: translateY(-50%);
      display: grid;
      gap: 10px;
    }

    .rail button {
      width: 9px;
      height: 9px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(248, 240, 220, 0.36);
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }

    .rail button[aria-current="true"] {
      transform: scale(1.65);
      background: var(--gold);
    }

    .hint {
      position: fixed;
      left: 32px;
      bottom: 22px;
      z-index: 20;
      color: rgba(248, 240, 220, 0.58);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
    }

    @media (max-width: 760px) {
      .slide {
        min-height: 720px;
      }

      .slide::after {
        inset: 12px;
      }

      .rail {
        right: 12px;
      }

      .hint {
        left: 18px;
        bottom: 14px;
      }
    }
  </style>
</head>
<body>

    const palette = {
      ink: "#f8f0dc",
      muted: "rgba(248, 240, 220, 0.72)",
      faint: "rgba(248, 240, 220, 0.14)",
      gold: "#e9c46a",
      green: "#7fb069",
      dark: "#06140f",
      panel: "rgba(6, 20, 15, 0.56)"
    };

    const main = document.getElementById("deck");
    const rail = document.getElementById("rail");
    const progressBar = document.getElementById("progressBar");
    const canvases = [];

    deck.forEach((slide, index) => {
      const section = document.createElement("section");
      section.className = "slide";
      section.id = `slide-${index + 1}`;
      section.dataset.index = index;

      const canvas = document.createElement("canvas");
      canvas.setAttribute("aria-label", slide.title);
      section.appendChild(canvas);
      main.appendChild(section);
      canvases.push(canvas);

      button.type = "button";
      button.setAttribute("aria-label", `跳转到第 ${index + 1} 页`);
      button.addEventListener("click", () => section.scrollIntoView({ behavior: "smooth", block: "start" }));
      rail.appendChild(button);
    });

    function setupCanvas(canvas) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, w: rect.width, h: rect.height };
    }

    function font(size, weight = 500) {
      return `${weight} ${size}px Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif`;
    }

    function lineHeight(size, factor = 1.28) {
      return Math.round(size * factor);
    }

    function wrapText(ctx, text, x, y, maxWidth, size, color = palette.ink, weight = 500, factor = 1.28) {
      ctx.font = font(size, weight);
      ctx.fillStyle = color;
      const words = String(text).split("");
      const lines = [];
      let line = "";
      words.forEach((word) => {
        const test = line + word;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      });
      if (line) lines.push(line);
      const lh = lineHeight(size, factor);
      lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
      return lines.length * lh;
    }

    function pill(ctx, text, x, y, options = {}) {
      const size = options.size || 15;
      ctx.font = font(size, 700);
      const padX = options.padX || 16;
      const padY = options.padY || 8;
      const width = ctx.measureText(text).width + padX * 2;
      const height = size + padY * 2;
      roundRect(ctx, x, y, width, height, height / 2, options.fill || "rgba(233,196,106,0.14)", options.stroke || "rgba(233,196,106,0.34)");
      ctx.fillStyle = options.color || palette.gold;
      ctx.fillText(text, x + padX, y + padY + size - 2);
      return width;
    }

    function roundRect(ctx, x, y, w, h, r, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) {
        ctx.fillStyle = fill;
        ctx.fill();
      }
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function rule(ctx, x, y, width) {
      const grad = ctx.createLinearGradient(x, y, x + width, y);
      grad.addColorStop(0, "rgba(127,176,105,0.9)");
      grad.addColorStop(0.52, "rgba(233,196,106,0.9)");
      grad.addColorStop(1, "rgba(248,240,220,0)");
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + width, y);
      ctx.stroke();
    }

    function frame(ctx, w, h, slide, index) {
      const margin = Math.max(42, Math.min(w, h) * 0.06);
      pill(ctx, slide.kicker, margin, margin, { size: 14 });
      ctx.fillStyle = "rgba(248,240,220,0.58)";
      ctx.font = font(13, 700);
      ctx.fillText(String(index + 1).padStart(2, "0") + " / " + String(deck.length).padStart(2, "0"), w - margin - 72, margin + 25);
      rule(ctx, margin, margin + 58, Math.min(380, w * 0.34));
      return margin;
    }

    function drawTitle(ctx, slide, x, y, width, size) {
      return wrapText(ctx, slide.title, x, y, width, size, palette.ink, 800, 1.14);
    }

    function drawCover(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      const titleSize = w < 760 ? 46 : 74;
      const titleY = h * 0.32;
      drawTitle(ctx, slide, m, titleY, w - m * 2, titleSize);
      wrapText(ctx, slide.subtitle, m, titleY + titleSize * 2.1, Math.min(880, w - m * 2), w < 760 ? 20 : 25, palette.muted, 500, 1.45);
      let x = m;
      const y = h - m - 72;
      slide.meta.forEach((item) => {
        x += pill(ctx, item, x, y, { fill: "rgba(248,240,220,0.09)", stroke: "rgba(248,240,220,0.18)", color: palette.ink, size: w < 760 ? 12 : 14 }) + 10;
      });
      ctx.strokeStyle = "rgba(233,196,106,0.28)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(w * 0.78, h * 0.45, Math.min(w, h) * 0.18, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w * 0.78, h * 0.45, Math.min(w, h) * 0.25, 0, Math.PI * 1.45);
      ctx.stroke();
    }

    function drawThesis(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      const titleH = drawTitle(ctx, slide, m, m + 112, Math.min(960, w - m * 2), w < 760 ? 34 : 52);
      wrapText(ctx, slide.claim, m, m + 140 + titleH, Math.min(920, w - m * 2), w < 760 ? 19 : 25, palette.muted, 500, 1.5);
      const startY = h * 0.58;
      const cardW = (w - m * 2 - 36) / 3;
      slide.proof.forEach((item, i) => {
        const col = i % 3;
        const row = Math.floor(i / 3);
        const x = m + col * (cardW + 18);
        const y = startY + row * 104;
        roundRect(ctx, x, y, cardW, 82, 8, "rgba(248,240,220,0.08)", "rgba(248,240,220,0.14)");
        ctx.fillStyle = i % 2 ? palette.gold : palette.green;
        ctx.font = font(28, 800);
        ctx.fillText("0" + (i + 1), x + 20, y + 38);
        ctx.fillStyle = palette.ink;
        ctx.font = font(w < 760 ? 15 : 18, 700);
        ctx.fillText(item, x + 78, y + 39);
      });
    }

    function drawTimeline(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      drawTitle(ctx, slide, m, m + 112, Math.min(880, w - m * 2), w < 760 ? 34 : 50);
      const x = m + 18;
      const y0 = h * 0.42;
      ctx.strokeStyle = "rgba(233,196,106,0.55)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y0);
      ctx.lineTo(x, h - m - 64);
      ctx.stroke();
      slide.items.forEach((item, i) => {
        const y = y0 + i * 104;
        ctx.fillStyle = i === 0 ? palette.gold : palette.green;
        ctx.beginPath();
        ctx.arc(x, y, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = palette.gold;
        ctx.font = font(16, 800);
        ctx.fillText(item[0], x + 34, y - 8);
        wrapText(ctx, item[1], x + 34, y + 18, Math.min(840, w - x - m - 34), w < 760 ? 17 : 22, palette.ink, 650, 1.3);
      });
    }

    function drawMatrix(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      const titleH = drawTitle(ctx, slide, m, m + 110, Math.min(970, w - m * 2), w < 760 ? 33 : 48);
      wrapText(ctx, slide.claim, m, m + 136 + titleH, Math.min(870, w - m * 2), w < 760 ? 17 : 22, palette.muted, 500, 1.45);
      const cols = w < 860 ? 2 : 3;
      const cardW = (w - m * 2 - (cols - 1) * 18) / cols;
      const cardH = w < 760 ? 116 : 130;
      const startY = h * 0.48;
      slide.cards.forEach((card, i) => {
        const x = m + (i % cols) * (cardW + 18);
        const y = startY + Math.floor(i / cols) * (cardH + 18);
        roundRect(ctx, x, y, cardW, cardH, 8, "rgba(248,240,220,0.075)", "rgba(248,240,220,0.14)");
        ctx.fillStyle = i % 2 ? palette.green : palette.gold;
        ctx.font = font(16, 800);
        ctx.fillText(card[0], x + 22, y + 36);
        wrapText(ctx, card[1], x + 22, y + 70, cardW - 44, w < 760 ? 14 : 17, palette.ink, 560, 1.35);
      });
    }

    function drawProcess(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      drawTitle(ctx, slide, m, m + 108, Math.min(1050, w - m * 2), w < 760 ? 32 : 48);
      const startX = m;
      const startY = h * 0.45;
      const gap = 18;
      const boxW = (w - m * 2 - gap * 3) / 4;
      slide.stages.forEach((stage, i) => {
        const x = startX + i * (boxW + gap);
        roundRect(ctx, x, startY, boxW, 172, 8, "rgba(6,20,15,0.5)", "rgba(233,196,106,0.2)");
        ctx.fillStyle = palette.gold;
        ctx.font = font(14, 800);
        ctx.fillText("0" + (i + 1), x + 20, startY + 32);
        ctx.fillStyle = palette.ink;
        ctx.font = font(w < 760 ? 17 : 21, 800);
        ctx.fillText(stage[0], x + 20, startY + 70);
        wrapText(ctx, stage[1], x + 20, startY + 104, boxW - 40, w < 760 ? 13 : 16, palette.muted, 500, 1.35);
        if (i < slide.stages.length - 1) {
          ctx.strokeStyle = "rgba(127,176,105,0.55)";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x + boxW + 4, startY + 86);
          ctx.lineTo(x + boxW + gap - 4, startY + 86);
          ctx.stroke();
        }
      });
      wrapText(ctx, slide.note, m, startY + 232, Math.min(980, w - m * 2), w < 760 ? 17 : 22, palette.ink, 650, 1.45);
    }

    function drawListSlide(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      drawTitle(ctx, slide, m, m + 110, Math.min(1080, w - m * 2), w < 760 ? 32 : 48);
      const startY = h * 0.42;
      slide.points.forEach((point, i) => {
        const y = startY + i * (w < 760 ? 82 : 92);
        ctx.fillStyle = i % 2 ? palette.green : palette.gold;
        ctx.beginPath();
        ctx.arc(m + 11, y + 8, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = palette.ink;
        ctx.font = font(w < 760 ? 18 : 23, 800);
        ctx.fillText(point[0], m + 38, y + 16);
        wrapText(ctx, point[1], m + 38, y + 46, Math.min(940, w - m * 2 - 38), w < 760 ? 14 : 18, palette.muted, 500, 1.35);
      });
    }

    function drawContact(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      drawTitle(ctx, slide, m, m + 112, Math.min(960, w - m * 2), w < 760 ? 32 : 48);
      const y = h * 0.47;
      const boxW = (w - m * 2 - 24) / 2;
      [[slide.left, palette.gold], [slide.right, palette.green]].forEach((group, i) => {
        const x = m + i * (boxW + 24);
        roundRect(ctx, x, y, boxW, 220, 8, "rgba(248,240,220,0.075)", "rgba(248,240,220,0.14)");
        ctx.fillStyle = group[1];
        ctx.font = font(18, 800);
        ctx.fillText(group[0][0], x + 26, y + 42);
        ctx.fillStyle = "rgba(248,240,220,0.48)";
        ctx.font = font(w < 760 ? 16 : 20, 650);
        ctx.fillText(group[0][1], x + 26, y + 102);
        ctx.strokeStyle = "rgba(248,240,220,0.22)";
        ctx.beginPath();
        ctx.moveTo(x + 26, y + 126);
        ctx.lineTo(x + boxW - 26, y + 126);
        ctx.stroke();
        ctx.fillStyle = palette.ink;
        ctx.font = font(w < 760 ? 17 : 23, 800);
        ctx.fillText(group[0][2], x + 26, y + 168);
      });
      let x = m;
      const fy = y + 280;
      slide.files.forEach((f) => {
        x += pill(ctx, f, x, fy, { fill: "rgba(127,176,105,0.12)", stroke: "rgba(127,176,105,0.22)", color: palette.ink, size: 13 }) + 9;
      });
    }

    function drawGeo(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      const titleH = drawTitle(ctx, slide, m, m + 106, Math.min(1050, w - m * 2), w < 760 ? 31 : 47);
      wrapText(ctx, slide.claim, m, m + 130 + titleH, Math.min(910, w - m * 2), w < 760 ? 16 : 21, palette.muted, 500, 1.42);
      const y = h * 0.48;
      ctx.fillStyle = palette.gold;
      ctx.font = font(17, 800);
      ctx.fillText("8 个 GEO 组件", m, y);
      let x = m;
      slide.components.forEach((c, i) => {
        if (x > w - m - 170) {
          x = m;
        }
        const row = Math.floor(i / 4);
        x += pill(ctx, c, x, y + 34 + row * 54, { fill: "rgba(248,240,220,0.08)", stroke: "rgba(248,240,220,0.13)", color: palette.ink, size: 14 }) + 10;
      });
      const sy = y + 184;
      ctx.fillStyle = palette.green;
      ctx.font = font(17, 800);
      ctx.fillText("5 种 JSON-LD Schema", m, sy);
      x = m;
      slide.schemas.forEach((s) => {
        x += pill(ctx, s, x, sy + 34, { fill: "rgba(127,176,105,0.12)", stroke: "rgba(127,176,105,0.24)", color: palette.ink, size: 14 }) + 10;
      });
    }

    function drawProduct(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      drawTitle(ctx, slide, m, m + 112, Math.min(1040, w - m * 2), w < 760 ? 31 : 47);
      const statW = (w - m * 2 - 36) / 4;
      const y = h * 0.44;
      slide.stats.forEach((stat, i) => {
        const x = m + i * (statW + 12);
        roundRect(ctx, x, y, statW, 140, 8, "rgba(248,240,220,0.075)", "rgba(248,240,220,0.14)");
        ctx.fillStyle = i % 2 ? palette.green : palette.gold;
        ctx.font = font(w < 760 ? 34 : 48, 900);
        ctx.fillText(stat[0], x + 20, y + 62);
        wrapText(ctx, stat[1], x + 20, y + 98, statW - 40, w < 760 ? 13 : 16, palette.ink, 650, 1.25);
      });
      const fy = y + 220;
      ctx.strokeStyle = "rgba(233,196,106,0.36)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(m, fy + 20);
      ctx.lineTo(w - m, fy + 20);
      ctx.stroke();
      slide.flow.forEach((f, i) => {
        const x = m + i * ((w - m * 2) / (slide.flow.length - 1));
        ctx.fillStyle = i % 2 ? palette.green : palette.gold;
        ctx.beginPath();
        ctx.arc(x, fy + 20, 8, 0, Math.PI * 2);
        ctx.fill();
        ctx.save();
        ctx.translate(x - 8, fy + 54);
        ctx.rotate(-Math.PI / 6);
        ctx.fillStyle = palette.ink;
        ctx.font = font(w < 760 ? 12 : 15, 700);
        ctx.fillText(f, 0, 0);
        ctx.restore();
      });
    }

    function drawCodex(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      drawTitle(ctx, slide, m, m + 112, Math.min(1040, w - m * 2), w < 760 ? 31 : 47);
      const y0 = h * 0.43;
      slide.bullets.forEach((b, i) => {
        const y = y0 + i * (w < 760 ? 78 : 88);
        ctx.fillStyle = palette.gold;
        ctx.font = font(15, 900);
        ctx.fillText("CODEX", m, y + 6);
        wrapText(ctx, b, m + 92, y, Math.min(980, w - m * 2 - 92), w < 760 ? 16 : 21, palette.ink, 650, 1.35);
      });
    }

    function drawScorecard(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      drawTitle(ctx, slide, m, m + 104, Math.min(1080, w - m * 2), w < 760 ? 31 : 47);
      const cols = w < 860 ? 2 : 4;
      const cardW = (w - m * 2 - (cols - 1) * 16) / cols;
      const cardH = w < 760 ? 118 : 136;
      const startY = h * 0.42;
      slide.metrics.forEach((metric, i) => {
        const x = m + (i % cols) * (cardW + 16);
        const y = startY + Math.floor(i / cols) * (cardH + 16);
        roundRect(ctx, x, y, cardW, cardH, 8, "rgba(248,240,220,0.075)", "rgba(248,240,220,0.14)");
        ctx.fillStyle = i % 2 ? palette.green : palette.gold;
        ctx.font = font(w < 760 ? 28 : 38, 900);
        ctx.fillText(metric[0], x + 20, y + 54);
        wrapText(ctx, metric[1], x + 20, y + 88, cardW - 40, w < 760 ? 13 : 16, palette.ink, 650, 1.3);
      });
    }

    function drawClosing(ctx, w, h, slide, index) {
      const m = frame(ctx, w, h, slide, index);
      drawTitle(ctx, slide, m, m + 102, Math.min(1050, w - m * 2), w < 760 ? 31 : 47);
      const startY = h * 0.42;
      slide.roadmap.forEach((item, i) => {
        const y = startY + i * 90;
        ctx.fillStyle = i % 2 ? palette.green : palette.gold;
        ctx.font = font(18, 900);
        ctx.fillText(item[0], m, y);
        wrapText(ctx, item[1], m + 86, y - 4, Math.min(940, w - m * 2 - 86), w < 760 ? 16 : 21, palette.ink, 620, 1.35);
      });
      wrapText(ctx, slide.close, m, h - m - 102, Math.min(920, w - m * 2), w < 760 ? 24 : 34, palette.gold, 850, 1.24);
    }

    function drawSlide(canvas, slide, index) {
      const { ctx, w, h } = setupCanvas(canvas);
      ctx.clearRect(0, 0, w, h);
      ctx.textBaseline = "alphabetic";
      if (slide.type === "cover") drawCover(ctx, w, h, slide, index);
      if (slide.type === "thesis") drawThesis(ctx, w, h, slide, index);
      if (slide.type === "timeline") drawTimeline(ctx, w, h, slide, index);
      if (slide.type === "matrix") drawMatrix(ctx, w, h, slide, index);
      if (slide.type === "process") drawProcess(ctx, w, h, slide, index);
      if (slide.type === "ux") drawListSlide(ctx, w, h, slide, index);
      if (slide.type === "contact") drawContact(ctx, w, h, slide, index);
      if (slide.type === "geo") drawGeo(ctx, w, h, slide, index);
      if (slide.type === "product") drawProduct(ctx, w, h, slide, index);
      if (slide.type === "codex") drawCodex(ctx, w, h, slide, index);
      if (slide.type === "scorecard") drawScorecard(ctx, w, h, slide, index);
      if (slide.type === "closing") drawClosing(ctx, w, h, slide, index);
    }

    function renderAll() {
      canvases.forEach((canvas, index) => drawSlide(canvas, deck[index], index));
    }

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          const index = Number(entry.target.dataset.index);
          [...rail.children].forEach((button, i) => button.setAttribute("aria-current", String(i === index)));
          progressBar.style.width = `${((index + 1) / deck.length) * 100}%`;
        }
      });
    }, { threshold: 0.62 });

    document.querySelectorAll(".slide").forEach((slide) => observer.observe(slide));

    window.addEventListener("resize", renderAll);
    window.addEventListener("keydown", (event) => {
      const current = [...rail.children].findIndex((button) => button.getAttribute("aria-current") === "true");
      if (event.key === "ArrowDown" || event.key === "PageDown") {
        event.preventDefault();
        document.getElementById(`slide-${Math.min(deck.length, current + 2)}`).scrollIntoView({ behavior: "smooth" });
      }
      if (event.key === "ArrowUp" || event.key === "PageUp") {
        event.preventDefault();
        document.getElementById(`slide-${Math.max(1, current)}`).scrollIntoView({ behavior: "smooth" });
      }
    });

    renderAll();
  </script>
</body>
</html>
