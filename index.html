<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>路演 PPT 展示入口</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07130f;
      --ink: #fff7e8;
      --muted: rgba(255, 247, 232, 0.72);
      --line: rgba(255, 247, 232, 0.18);
      --panel: rgba(9, 31, 24, 0.74);
      --gold: #f2c86b;
      --leaf: #7ecf92;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 22px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 18%, rgba(242, 200, 107, 0.16), transparent 30%),
        radial-gradient(circle at 18% 82%, rgba(126, 207, 146, 0.14), transparent 34%),
        linear-gradient(135deg, #07130f, #10291f 58%, #07130f);
    }

    main {
      width: min(1120px, 100%);
      display: grid;
      gap: 38px;
    }

    .eyebrow {
      width: fit-content;
      padding: 9px 15px;
      border: 1px solid rgba(242, 200, 107, 0.38);
      border-radius: 999px;
      background: rgba(242, 200, 107, 0.12);
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1,
    p {
      margin: 0;
    }

    h1 {
      max-width: 920px;
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1;
      letter-spacing: 0;
    }

    .lead {
      max-width: 760px;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 24px);
      line-height: 1.48;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    a {
      min-height: 260px;
      display: grid;
      align-content: space-between;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    a:hover {
      transform: translateY(-4px);
      border-color: rgba(242, 200, 107, 0.52);
      background: rgba(13, 42, 32, 0.9);
    }

    strong {
      display: block;
      margin-bottom: 12px;
      font-size: clamp(24px, 3vw, 36px);
      line-height: 1.08;
    }

    span {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
    }

    .tag {
      width: fit-content;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(126, 207, 146, 0.14);
      color: var(--leaf);
      font-size: 13px;
      font-weight: 850;
    }

    @media (max-width: 780px) {
      .grid {
        grid-template-columns: 1fr;
      }

      a {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Roadshow PPT Frontend</div>
    <h1>路演 PPT 展示入口</h1>
    <p class="lead">这里是给浏览器访问的前端演示页。打开下面任意一个 PPT，就可以像网页一样滚动或使用方向键演示。</p>
    <section class="grid" aria-label="PPT 列表">
      <a href="./roadshows/cross-border-skills-roadshow/">
        <div>
          <strong>跨境电商三大 Skill 路演 PPT</strong>
          <span>把竞品抓取、市场机会判断、评论洞察与内容脚本生成，汇总成一套 AI 作战流程。</span>
        </div>
        <div class="tag">打开演示</div>
      </a>
      <a href="./roadshows/yanag-roadshow-report/">
        <div>
          <strong>YANAG.com 网站搭建路演报告</strong>
          <span>复盘从零搭建出海企业网站的过程、关键节点、当前成果与下一阶段方向。</span>
        </div>
        <div class="tag">打开演示</div>
      </a>
    </section>
  </main>
</body>
</html>
